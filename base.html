```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DEXTERITY - Offer Verification Engine</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: #f3f4f6;
    }

    .card {
      background: #111827;
      border: 1px solid #263244;
      border-radius: 16px;
    }

    textarea {
      resize: vertical;
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- NAVBAR -->
  <nav class="border-b border-gray-800 bg-gray-900 px-6 py-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">

      <div>
        <h1 class="text-2xl font-bold text-white">
          ⚡ DEXTERITY
        </h1>

        <p class="text-xs text-gray-400">
          5-Category Offer Verification Engine
        </p>
      </div>

      <div class="flex items-center gap-2 text-sm">
        <span id="statusDot"
              class="w-3 h-3 rounded-full bg-gray-500"></span>

        <span id="statusText" class="text-gray-400">
          Checking backend...
        </span>
      </div>

    </div>
  </nav>


  <!-- MAIN -->
  <main class="max-w-6xl mx-auto px-6 py-8 space-y-6">

    <!-- INPUT -->
    <section class="card p-6">

      <h2 class="text-xl font-bold mb-4">
        Offer Content
      </h2>

      <textarea
        id="rawText"
        rows="10"
        class="w-full bg-gray-950 border border-gray-700 rounded-xl p-4 text-white outline-none focus:border-emerald-500"
        placeholder="Paste the offer letter here..."
      ></textarea>

      <div class="flex flex-wrap gap-3 mt-4">

        <button
          onclick="verifyOffer()"
          class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-bold">
          Verify Offer
        </button>

        <button
          onclick="clearOffer()"
          class="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-xl font-bold">
          Clear
        </button>

      </div>

    </section>


    <!-- FILE INPUT -->
    <section class="card p-6">

      <h2 class="text-lg font-bold mb-4">
        Upload TXT / PDF
      </h2>

      <input
        id="fileInput"
        type="file"
        accept=".txt,.pdf"
        class="block w-full text-sm text-gray-300"
      >

      <button
        onclick="readFile()"
        class="mt-4 bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-xl font-semibold">
        Load File
      </button>

    </section>


    <!-- RESULTS -->
    <section id="resultsSection"
             class="card p-6 hidden">

      <div class="flex justify-between items-center mb-6">

        <h2 class="text-xl font-bold">
          Verification Result
        </h2>

        <div id="totalScore"
             class="text-2xl font-bold text-emerald-400">
        </div>

      </div>

      <div id="checks"
           class="space-y-4">
      </div>

    </section>

  </main>


<script>

const API_BASE = window.location.origin;


/* =========================================================
   BACKEND STATUS
========================================================= */

async function checkBackend() {

  const dot = document.getElementById("statusDot");
  const text = document.getElementById("statusText");

  try {

    const response = await fetch(`${API_BASE}/health`);

    if (!response.ok) {
      throw new Error("Backend unavailable");
    }

    dot.className =
      "w-3 h-3 rounded-full bg-emerald-500";

    text.textContent =
      "Python Backend Connected";

    text.className =
      "text-emerald-400";

  } catch (error) {

    dot.className =
      "w-3 h-3 rounded-full bg-red-500";

    text.textContent =
      "Backend Offline";

    text.className =
      "text-red-400";
  }
}


/* =========================================================
   VERIFY
========================================================= */

async function verifyOffer() {

  const text = document
    .getElementById("rawText")
    .value
    .trim();

  if (!text) {

    alert("Paste an offer letter first.");

    return;
  }


  const button =
    document.querySelector("button[onclick='verifyOffer()']");

  button.disabled = true;
  button.textContent = "Checking...";


  try {

    const response = await fetch(
      `${API_BASE}/verify`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          text: text
        })
      }
    );


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.detail || "Verification failed."
      );
    }


    displayResults(data);


  } catch (error) {

    alert("Error: " + error.message);

  } finally {

    button.disabled = false;
    button.textContent = "Verify Offer";

  }
}


/* =========================================================
   DISPLAY RESULTS
========================================================= */

function displayResults(data) {

  const section =
    document.getElementById("resultsSection");

  const checks =
    document.getElementById("checks");

  const total =
    document.getElementById("totalScore");


  section.classList.remove("hidden");

  checks.innerHTML = "";


  const totalScore =
    data.total_score ??
    data.total_points ??
    data.score ??
    0;


  total.textContent =
    `${totalScore}/100`;


  const checkNames = [
    ["check_1", "Company Verification"],
    ["check_2", "Recruiter Verification"],
    ["check_3", "Salary Viability"],
    ["check_4", "Email Verification"],
    ["check_5", "Scam Detection"]
  ];


  checkNames.forEach(([key, title]) => {

    const result = data[key];

    if (!result) {
      return;
    }


    const points =
      Number(result.points || 0);


    const passed =
      result.passed;


    let statusText = "Not passed";
    let statusClass = "text-red-400";

    if (passed === true) {

      statusText = "Passed";
      statusClass = "text-emerald-400";

    } else if (passed === null) {

      statusText = "Needs review";
      statusClass = "text-yellow-400";
    }


    const card =
      document.createElement("div");

    card.className =
      "bg-gray-950 border border-gray-800 rounded-xl p-5";


    card.innerHTML = `

      <div class="flex justify-between items-start gap-4">

        <div>

          <h3 class="font-bold text-lg">
            ${title}
          </h3>

          <p class="${statusClass} text-sm mt-1">
            ${statusText}
          </p>

        </div>

        <div class="font-bold text-lg">
          ${points}/20
        </div>

      </div>

      <p class="text-gray-400 text-sm mt-4">
        ${escapeHtml(result.reason || "No explanation provided.")}
      </p>

    `;


    checks.appendChild(card);

  });


  /* COMPANY DETAILS */

  if (data.check_1) {

    const company =
      data.check_1.company_name;

    if (company) {

      const companyBox =
        document.createElement("div");

      companyBox.className =
        "mt-4 bg-gray-900 border border-gray-700 rounded-xl p-4";


      companyBox.innerHTML = `

        <p class="text-sm text-gray-400">
          Detected company
        </p>

        <p class="font-bold text-white mt-1">
          ${escapeHtml(company)}
        </p>

      `;


      checks.prepend(companyBox);
    }
  }
}


/* =========================================================
   FILE READER
========================================================= */

async function readFile() {

  const input =
    document.getElementById("fileInput");

  const file = input.files[0];

  if (!file) {

    alert("Choose a TXT or PDF file first.");

    return;
  }


  const formData =
    new FormData();

  formData.append("file", file);


  let endpoint;


  if (
    file.name.toLowerCase().endsWith(".pdf")
  ) {

    endpoint = "/read-pdf";

  } else {

    endpoint = "/read-txt";
  }


  try {

    const response =
      await fetch(
        `${API_BASE}${endpoint}`,
        {
          method: "POST",
          body: formData
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.detail || "Could not read file."
      );
    }


    document.getElementById("rawText").value =
      data.text || "";


  } catch (error) {

    alert("Error: " + error.message);
  }
}


/* =========================================================
   CLEAR
========================================================= */

function clearOffer() {

  document.getElementById("rawText").value = "";

  document
    .getElementById("resultsSection")
    .classList.add("hidden");

  document
    .getElementById("checks")
    .innerHTML = "";

  document
    .getElementById("totalScore")
    .textContent = "";
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value)

    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* =========================================================
   START
========================================================= */

checkBackend();

</script>

</body>
</html>
```
